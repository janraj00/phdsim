[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phdsim"
version = "0.7.0"
description = "SCOUT multi-agent semantic terrain mapping and active acquisition benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
phdsim = "phdsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
